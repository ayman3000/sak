name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build -c release
      - name: Smoke test
        run: |
          .build/release/sak --version
          .build/release/sak --help | grep -q "exit codes"
          # No prompt and no input: usage error, exit 2.
          set +e; .build/release/sak < /dev/null; code=$?; set -e
          test "$code" = 2
